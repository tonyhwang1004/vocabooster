<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocaBooster - 내 학습 현황</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 요약 카드 */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .summary-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .summary-card.highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: span 2;
        }
        
        .summary-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .summary-value {
            font-size: 28px;
            font-weight: 700;
        }
        
        .summary-label {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        /* 섹션 */
        .section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-action {
            background: #f0f0f0;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            color: #666;
        }
        
        .section-action:hover {
            background: #e0e0e0;
        }
        
        /* 차트 */
        .chart-container {
            height: 150px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 10px 0;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .chart-bar {
            width: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px 5px 0 0;
            position: relative;
            min-height: 10px;
            transition: height 0.3s;
        }
        
        .chart-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #888;
            white-space: nowrap;
        }
        
        .chart-bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: #333;
        }
        
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            font-size: 12px;
            color: #666;
        }
        
        /* 단어 리스트 */
        .word-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .word-item:last-child {
            border-bottom: none;
        }
        
        .word-info {
            flex: 1;
        }
        
        .word-english {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        
        .word-korean {
            font-size: 14px;
            color: #666;
            margin-top: 3px;
        }
        
        .word-meta {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        
        .word-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }
        
        .badge-warning {
            background: #fff3e0;
            color: #e65100;
        }
        
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        /* 최근 기록 */
        .record-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .record-item:last-child {
            border-bottom: none;
        }
        
        .record-score {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            margin-right: 15px;
        }
        
        .record-score.pass {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .record-score.fail {
            background: #ffebee;
            color: #c62828;
        }
        
        .record-info {
            flex: 1;
        }
        
        .record-lesson {
            font-weight: 600;
            font-size: 15px;
        }
        
        .record-date {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        
        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        /* 하단 버튼 */
        .bottom-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        
        .bottom-actions-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        /* 탭 */
        .tabs {
            display: flex;
            background: #f0f0f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* 로딩 */
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 학습 팁 배너 */
        .tip-banner {
            background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .tip-banner-icon {
            font-size: 32px;
        }
        
        .tip-banner-text h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }
        
        .tip-banner-text p {
            font-size: 13px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <button class="back-btn" onclick="goHome()">← 돌아가기</button>
            <h1>📊 내 학습 현황</h1>
            <p id="studentName">학습 통계를 확인하세요</p>
        </div>
    </div>
    
    <div class="container">
        <!-- 로딩 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중...</p>
        </div>
        
        <!-- 메인 컨텐츠 -->
        <div id="mainContent" style="display: none;">
            <!-- 요약 카드 -->
            <div class="summary-cards">
                <div class="summary-card highlight">
                    <div class="summary-icon">🔥</div>
                    <div class="summary-value" id="studyStreak">0일</div>
                    <div class="summary-label">연속 학습</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">📝</div>
                    <div class="summary-value" id="totalTests">0</div>
                    <div class="summary-label">총 시험</div>
                </div>
                <div class="summary-card">
                    <div class="summary-icon">⭐</div>
                    <div class="summary-value" id="avgScore">0점</div>
                    <div class="summary-label">평균 점수</div>
                </div>
            </div>
            
            <!-- 학습 팁 배너 -->
            <div class="tip-banner" id="tipBanner" style="display: none;">
                <div class="tip-banner-icon">💪</div>
                <div class="tip-banner-text">
                    <h3 id="tipTitle">오늘의 학습 목표</h3>
                    <p id="tipContent">복습할 단어가 있습니다!</p>
                </div>
            </div>
            
            <!-- 탭 -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('chart')">📈 학습 추이</button>
                <button class="tab" onclick="showTab('words')">📚 취약 단어</button>
                <button class="tab" onclick="showTab('records')">📋 기록</button>
            </div>
            
            <!-- 차트 탭 -->
            <div class="section" id="chartTab">
                <div class="section-header">
                    <div class="section-title">📈 최근 7일 학습</div>
                </div>
                <div class="chart-container" id="chartContainer">
                    <!-- 차트가 여기에 렌더링됨 -->
                </div>
                <div class="chart-legend">
                    <span>📊 일일 평균 점수</span>
                </div>
            </div>
            
            <!-- 취약 단어 탭 -->
            <div class="section" id="wordsTab" style="display: none;">
                <div class="section-header">
                    <div class="section-title">📚 취약 단어 (<span id="weakWordCount">0</span>개)</div>
                    <button class="section-action" onclick="studyWeakWords()">학습하기</button>
                </div>
                <div class="word-list" id="weakWordList">
                    <div class="empty-state">
                        <div class="empty-state-icon">🎉</div>
                        <p>취약 단어가 없습니다!</p>
                    </div>
                </div>
            </div>
            
            <!-- 기록 탭 -->
            <div class="section" id="recordsTab" style="display: none;">
                <div class="section-header">
                    <div class="section-title">📋 최근 시험 기록</div>
                </div>
                <div id="recordList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>시험 기록이 없습니다</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 하단 버튼 -->
    <div class="bottom-actions">
        <div class="bottom-actions-content">
            <button class="btn btn-secondary" onclick="goHome()">홈으로</button>
            <button class="btn btn-primary" onclick="startPractice()">연습 시작</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwGFbsj8FgFIuF-iFkJ4ekyS76MWQf9UrUysJ-Fs12vuVByJwenoYRgOJeOZiPOa6gzkg/exec';
        
        let currentStudent = null;
        let statsData = null;
        let weakWords = [];
        
        document.addEventListener('DOMContentLoaded', async function() {
            const studentStr = sessionStorage.getItem('vb_current_student');
            
            if (!studentStr) {
                window.location.href = 'index.html';
                return;
            }
            
            currentStudent = JSON.parse(studentStr);
            document.getElementById('studentName').textContent = `${currentStudent.name}님의 학습 현황`;
            
            await loadData();
        });
        
        async function loadData() {
            try {
                // 통계 로드
                const statsResponse = await fetch(
                    `${API_URL}?vb=true&action=getStudyStats&name=${encodeURIComponent(currentStudent.name)}&phone=${currentStudent.phone || ''}`
                );
                const statsResult = await statsResponse.json();
                
                if (statsResult.success) {
                    statsData = statsResult.stats;
                }
                
                // 취약 단어 로드
                const weakResponse = await fetch(
                    `${API_URL}?vb=true&action=getWeakWords&name=${encodeURIComponent(currentStudent.name)}&phone=${currentStudent.phone || ''}&limit=50`
                );
                const weakResult = await weakResponse.json();
                
                if (weakResult.success) {
                    weakWords = weakResult.words;
                }
                
                displayData();
                
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                alert('데이터를 불러오는데 실패했습니다.');
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }
        
        function displayData() {
            if (!statsData) return;
            
            // 요약 카드
            document.getElementById('studyStreak').textContent = statsData.studyStreak + '일';
            document.getElementById('totalTests').textContent = statsData.totalTests;
            document.getElementById('avgScore').textContent = statsData.averageScore + '점';
            
            // 차트 렌더링
            renderChart();
            
            // 취약 단어
            document.getElementById('weakWordCount').textContent = weakWords.length;
            renderWeakWords();
            
            // 최근 기록
            renderRecords();
            
            // 팁 배너
            if (weakWords.length > 0) {
                document.getElementById('tipBanner').style.display = 'flex';
                document.getElementById('tipTitle').textContent = '취약 단어 알림';
                document.getElementById('tipContent').textContent = `${weakWords.length}개의 취약 단어를 복습해보세요!`;
            }
        }
        
        function renderChart() {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';
            
            if (!statsData.weeklyTests || statsData.weeklyTests.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>아직 데이터가 없습니다</p></div>';
                return;
            }
            
            const maxScore = 100;
            
            statsData.weeklyTests.forEach(day => {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                const height = day.avgScore > 0 ? (day.avgScore / maxScore) * 120 : 10;
                bar.style.height = height + 'px';
                
                if (day.avgScore === 0) {
                    bar.style.background = '#e0e0e0';
                }
                
                const dateObj = new Date(day.date);
                const dayName = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
                
                bar.innerHTML = `
                    <div class="chart-bar-value">${day.tests > 0 ? day.avgScore : '-'}</div>
                    <div class="chart-bar-label">${dayName}</div>
                `;
                
                container.appendChild(bar);
            });
        }
        
        function renderWeakWords() {
            const list = document.getElementById('weakWordList');
            
            if (weakWords.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎉</div>
                        <p>취약 단어가 없습니다!</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = '';
            
            weakWords.slice(0, 20).forEach(word => {
                const badgeClass = word.wrongCount >= 5 ? 'badge-danger' : 
                                   word.wrongCount >= 3 ? 'badge-warning' : 'badge-success';
                
                const item = document.createElement('div');
                item.className = 'word-item';
                item.innerHTML = `
                    <div class="word-info">
                        <div class="word-english">${word.english}</div>
                        <div class="word-korean">${word.korean}</div>
                        <div class="word-meta">틀린 횟수: ${word.wrongCount}회</div>
                    </div>
                    <span class="word-badge ${badgeClass}">${word.wrongCount}회</span>
                `;
                list.appendChild(item);
            });
        }
        
        function renderRecords() {
            const list = document.getElementById('recordList');
            
            if (!statsData.recentScores || statsData.recentScores.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>시험 기록이 없습니다</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = '';
            
            statsData.recentScores.forEach(record => {
                const passed = record.score >= 80;
                const item = document.createElement('div');
                item.className = 'record-item';
                item.innerHTML = `
                    <div class="record-score ${passed ? 'pass' : 'fail'}">${record.score}</div>
                    <div class="record-info">
                        <div class="record-lesson">${record.lesson}</div>
                        <div class="record-date">${record.date}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }
        
        function showTab(tabName) {
            // 탭 버튼 활성화
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 탭 컨텐츠 표시
            document.getElementById('chartTab').style.display = tabName === 'chart' ? 'block' : 'none';
            document.getElementById('wordsTab').style.display = tabName === 'words' ? 'block' : 'none';
            document.getElementById('recordsTab').style.display = tabName === 'records' ? 'block' : 'none';
        }
        
        function studyWeakWords() {
            if (weakWords.length === 0) {
                alert('취약 단어가 없습니다!');
                return;
            }
            
            // 취약 단어로 테스트 시작
            const testData = JSON.parse(sessionStorage.getItem('vb_test_data') || '{}');
            testData.weakWords = weakWords;
            sessionStorage.setItem('vb_test_data', JSON.stringify(testData));
            window.location.href = 'test.html?mode=weak';
        }
        
        function startPractice() {
    // 현재 학생의 wordbook 정보로 테스트 데이터 설정
    const testData = {
        todayTest: {
            folder: currentStudent.wordbook,  // 또는 적절한 폴더명
            wordbook: currentStudent.wordbook,
            lessons: ['DAY1']  // 연습할 레슨 지정 (또는 사용자 선택)
        }
    };
    sessionStorage.setItem('vb_test_data', JSON.stringify(testData));
    window.location.href = 'test.html?mode=practice';
}
        
        function goHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
