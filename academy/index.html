<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocaBooster - 김엄마관리형독서실</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #aaa;
        }
        
        .phone-hint {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-study {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-study:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider span {
            padding: 0 15px;
            color: #888;
            font-size: 12px;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        .message.info {
            background: #e3f2fd;
            color: #1565c0;
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }
        
        .remember-me label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
        }
        
        /* 모드 선택 화면 */
        .mode-selection {
            display: none;
        }
        
        .mode-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .mode-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .mode-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .mode-card p {
            font-size: 13px;
            color: #666;
        }
        
        .mode-icon {
            font-size: 24px;
        }
        
        .student-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .student-info h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .student-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
        }
        
        .student-info-item {
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 8px;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #667eea;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        
        .stats-preview {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .stats-row:last-child {
            margin-bottom: 0;
        }
        
        .stats-label {
            color: #666;
        }
        
        .stats-value {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div id="loginScreen">
            <div class="logo">
                <h1>📚 VocaBooster</h1>
                <p>김엄마관리형독서실 영단어 시험</p>
            </div>
            
            <div id="message" class="message"></div>
            
            <div class="form-group">
                <label for="studentName">이름</label>
                <input type="text" id="studentName" placeholder="이름을 입력하세요" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="studentPhone">전화번호 뒷자리 4자리</label>
                <input type="tel" id="studentPhone" placeholder="예: 1234" maxlength="4" pattern="[0-9]*" inputmode="numeric">
                <p class="phone-hint">동명이인 구분을 위해 입력해주세요</p>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">내 정보 기억하기</label>
            </div>
            
            <button class="btn btn-primary" onclick="login()">로그인</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>확인 중...</p>
            </div>
        </div>
        
        <!-- 모드 선택 화면 -->
        <div id="modeScreen" class="mode-selection">
            <button class="back-btn" onclick="showLogin()">← 다시 로그인</button>
            
            <div class="student-info" id="studentInfo">
                <h2 id="welcomeName">환영합니다!</h2>
                <div class="student-info-grid">
                    <div class="student-info-item">📖 <span id="infoWordbook">-</span></div>
                    <div class="student-info-item">📍 <span id="infoProgress">-</span></div>
                    <div class="student-info-item">⭐ <span id="infoScore">-</span>점</div>
                    <div class="student-info-item">🔥 <span id="infoStreak">-</span>일 연속</div>
                </div>
            </div>
            
            <div id="modeMessage" class="message"></div>
            
            <div class="mode-card" onclick="startTest('regular')">
                <h3><span class="mode-icon">📝</span> 오늘의 시험</h3>
                <p id="todayTestInfo">오늘 배정된 시험을 봅니다</p>
            </div>
            
            <div class="mode-card" onclick="startTest('review')">
                <h3><span class="mode-icon">🔄</span> 복습 시험</h3>
                <p id="reviewInfo">이전에 배운 내용을 복습합니다</p>
            </div>
            
            <div class="mode-card" onclick="startTest('weak')">
                <h3><span class="mode-icon">💪</span> 취약 단어 집중</h3>
                <p id="weakInfo">자주 틀리는 단어를 집중 학습합니다</p>
            </div>
            
            <div class="mode-card" onclick="goToMyStudy()">
                <h3><span class="mode-icon">📊</span> 내 학습 현황</h3>
                <p>학습 통계와 틀린 단어를 확인합니다</p>
            </div>
            
            <div class="stats-preview" id="statsPreview">
                <div class="stats-row">
                    <span class="stats-label">총 시험</span>
                    <span class="stats-value" id="statsTotalTests">-회</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">평균 점수</span>
                    <span class="stats-value" id="statsAvgScore">-점</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label">학습중인 단어</span>
                    <span class="stats-value" id="statsLearningWords">-개</span>
                </div>
            </div>
        </div>
    </div>
    
    <p class="footer">VocaBooster v2.0 - 스마트 영단어 학습</p>
    
    <script>
        // API 설정
        const API_URL = 'https://script.google.com/macros/s/AKfycbwGFbsj8FgFIuF-iFkJ4ekyS76MWQf9UrUysJ-Fs12vuVByJwenoYRgOJeOZiPOa6gzkg/exec';
        
        let currentStudent = null;
        let todayTestData = null;
        
        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', function() {
            // 저장된 정보 불러오기
            const savedName = localStorage.getItem('vb_student_name');
            const savedPhone = localStorage.getItem('vb_student_phone');
            
            if (savedName) {
                document.getElementById('studentName').value = savedName;
            }
            if (savedPhone) {
                document.getElementById('studentPhone').value = savedPhone;
            }
            
            // Enter 키 처리
            document.getElementById('studentName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('studentPhone').focus();
                }
            });
            
            document.getElementById('studentPhone').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    login();
                }
            });
        });
        
        // 로그인
        async function login() {
            const name = document.getElementById('studentName').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            
            if (!name) {
                showMessage('이름을 입력해주세요.', 'error');
                return;
            }
            
            if (!phone || phone.length !== 4) {
                showMessage('전화번호 뒷자리 4자리를 입력해주세요.', 'error');
                return;
            }
            
            showLoading(true);
            hideMessage();
            
            try {
                // 학생 정보 조회
                const response = await fetch(`${API_URL}?vb=true&action=getStudentByPhone&name=${encodeURIComponent(name)}&phone=${phone}`);
                const data = await response.json();
                
                if (!data.success) {
                    showMessage(data.error || '학생 정보를 찾을 수 없습니다.', 'error');
                    showLoading(false);
                    return;
                }
                
                currentStudent = data.student;
                
                // 정보 저장
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('vb_student_name', name);
                    localStorage.setItem('vb_student_phone', phone);
                }
                
                // 오늘 시험 정보 조회
                const testResponse = await fetch(`${API_URL}?vb=true&action=getTodayTest&name=${encodeURIComponent(name)}&phone=${phone}`);
                todayTestData = await testResponse.json();
                
                // 학습 통계 조회
                const statsResponse = await fetch(`${API_URL}?vb=true&action=getStudyStats&name=${encodeURIComponent(name)}&phone=${phone}`);
                const statsData = await statsResponse.json();
                
                showLoading(false);
                showModeSelection(statsData.stats);
                
            } catch (error) {
                console.error('Login error:', error);
                showMessage('서버 연결에 실패했습니다. 다시 시도해주세요.', 'error');
                showLoading(false);
            }
        }
        
        // 모드 선택 화면 표시
        function showModeSelection(stats) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('modeScreen').style.display = 'block';
            
            // 학생 정보 표시
            document.getElementById('welcomeName').textContent = `${currentStudent.name}님 환영합니다!`;
            document.getElementById('infoWordbook').textContent = currentStudent.wordbook;
            document.getElementById('infoProgress').textContent = `DAY ${currentStudent.currentDay}`;
            document.getElementById('infoScore').textContent = currentStudent.score || 0;
            document.getElementById('infoStreak').textContent = stats ? stats.studyStreak : 0;
            
            // 통계 표시
            if (stats) {
                document.getElementById('statsTotalTests').textContent = stats.totalTests + '회';
                document.getElementById('statsAvgScore').textContent = stats.averageScore + '점';
                document.getElementById('statsLearningWords').textContent = stats.learningWords + '개';
            }
            
            // 오늘 시험 정보
            if (todayTestData && todayTestData.success) {
                if (todayTestData.isTestDay) {
                    document.getElementById('todayTestInfo').textContent = 
                        `${todayTestData.todayTest.lessons.join(', ')} 시험`;
                } else {
                    document.getElementById('todayTestInfo').textContent = 
                        '오늘은 시험일이 아닙니다 (연습 가능)';
                }
                
                // 복습 정보
                const reviewCount = todayTestData.reviewTests ? todayTestData.reviewTests.length : 0;
                document.getElementById('reviewInfo').textContent = 
                    reviewCount > 0 ? `${reviewCount}개의 복습이 대기 중입니다` : '복습할 내용이 없습니다';
                
                // 취약 단어 정보
                const weakCount = todayTestData.weakWords ? todayTestData.weakWords.length : 0;
                document.getElementById('weakInfo').textContent = 
                    weakCount > 0 ? `${weakCount}개의 취약 단어가 있습니다` : '취약 단어가 없습니다';
            }
        }
        
        // 로그인 화면 표시
        function showLogin() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('modeScreen').style.display = 'none';
            currentStudent = null;
            todayTestData = null;
        }
        
        // 시험 시작
        function startTest(mode) {
            if (!currentStudent) return;
            
            // 세션 정보 저장
            sessionStorage.setItem('vb_current_student', JSON.stringify(currentStudent));
            sessionStorage.setItem('vb_test_data', JSON.stringify(todayTestData));
            sessionStorage.setItem('vb_test_mode', mode);
            
            // 시험 페이지로 이동
            window.location.href = `test.html?mode=${mode}`;
        }
        
        // 내 학습 현황으로 이동
        function goToMyStudy() {
            if (!currentStudent) return;
            
            sessionStorage.setItem('vb_current_student', JSON.stringify(currentStudent));
            window.location.href = 'my-study.html';
        }
        
        // 메시지 표시
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }
        
        // 로딩 표시
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }
    </script>
</body>
</html>
