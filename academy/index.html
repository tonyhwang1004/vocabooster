<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>김엄마관리형독서실 - VocaBooster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header .subtitle {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .form-label {
            font-weight: 600;
            color: #555;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            color: #666;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
            color: #333;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #aaa;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }
        .student-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            display: none;
            margin-top: 10px;
        }
        .student-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .student-item:hover {
            background: #f5f5ff;
        }
        .student-item:last-child {
            border-bottom: none;
        }
        .student-item .name {
            font-weight: 600;
            color: #333;
        }
        .student-item .info {
            font-size: 12px;
            color: #888;
        }
        .error-message {
            background: #ffe0e0;
            color: #c00;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading .spinner-border {
            color: #667eea;
        }
        .footer {
            margin-top: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .footer a {
            color: white;
            text-decoration: none;
        }
        
        /* 모달 스타일 */
        .modal-content {
            border-radius: 15px;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }
        .test-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
        }
        .test-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .test-info-item:last-child {
            border-bottom: none;
        }
        .test-info-label {
            color: #666;
        }
        .test-info-value {
            font-weight: 600;
            color: #333;
        }
        .score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
        }
        .score-positive {
            background: #d4edda;
            color: #155724;
        }
        .score-negative {
            background: #f8d7da;
            color: #721c24;
        }
        .review-list {
            margin-top: 15px;
        }
        .review-item {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .retest-warning {
            background: #f8d7da;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .retest-warning h5 {
            color: #721c24;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏠 <span id="academyName">김엄마관리형독서실</span></h1>
        <div class="subtitle">VocaBooster</div>
    </div>

    <div class="login-card">
        <h2><i class="bi bi-person-circle"></i> 학생 로그인</h2>
        
        <div class="mb-3">
            <label class="form-label">이름</label>
            <input type="text" class="form-control" id="studentName" placeholder="이름을 입력하세요" autocomplete="off">
            <div class="student-list" id="studentList"></div>
        </div>
        
        <button class="btn btn-primary" id="btnLogin">
            <i class="bi bi-box-arrow-in-right"></i> 시험 보기
        </button>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="loading" id="loading">
            <div class="spinner-border" role="status"></div>
            <p class="mt-2">정보를 불러오는 중...</p>
        </div>
        
        <div class="divider"><span>또는</span></div>
        
        <button class="btn btn-secondary" onclick="location.href='../index.html'">
            <i class="bi bi-controller"></i> 자유 연습 모드
        </button>
    </div>

    <div class="footer">
        <a href="../index.html">개인용 버전으로 이동</a>
    </div>

    <!-- 오늘의 시험 모달 -->
    <div class="modal fade" id="todayTestModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-calendar-check"></i> 오늘의 시험</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ⚠️ 중요: 이 URL을 Google Apps Script 배포 URL로 변경하세요!
        const API_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        
        let studentData = null;
        let todayTestData = null;
        let allStudents = [];

        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            loadStudentList();
            
            // 이름 입력 자동완성
            document.getElementById('studentName').addEventListener('input', filterStudents);
            document.getElementById('studentName').addEventListener('focus', function() {
                if (allStudents.length > 0) {
                    document.getElementById('studentList').style.display = 'block';
                    filterStudents();
                }
            });
            
            // 로그인 버튼
            document.getElementById('btnLogin').addEventListener('click', login);
            
            // 엔터 키
            document.getElementById('studentName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });
            
            // 외부 클릭 시 목록 닫기
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.mb-3')) {
                    document.getElementById('studentList').style.display = 'none';
                }
            });
        });

        // 설정 불러오기
        async function loadSettings() {
            try {
                const response = await fetch(`${API_URL}?action=getSettings`);
                const data = await response.json();
                
                if (data.success && data.settings['독서실명']) {
                    document.getElementById('academyName').textContent = data.settings['독서실명'];
                }
            } catch (error) {
                console.log('설정 로드 실패:', error);
            }
        }

        // 학생 목록 불러오기
        async function loadStudentList() {
            try {
                const response = await fetch(`${API_URL}?action=getStudentList`);
                const data = await response.json();
                
                if (data.success) {
                    allStudents = data.students;
                }
            } catch (error) {
                console.log('학생 목록 로드 실패:', error);
            }
        }

        // 학생 필터링 (자동완성)
        function filterStudents() {
            const input = document.getElementById('studentName').value.trim();
            const listEl = document.getElementById('studentList');
            
            if (!input) {
                listEl.innerHTML = allStudents.map(s => `
                    <div class="student-item" onclick="selectStudent('${s.name}')">
                        <div class="name">${s.name}</div>
                        <div class="info">${s.floor} · ${s.wordbook}</div>
                    </div>
                `).join('');
            } else {
                const filtered = allStudents.filter(s => s.name.includes(input));
                listEl.innerHTML = filtered.map(s => `
                    <div class="student-item" onclick="selectStudent('${s.name}')">
                        <div class="name">${s.name}</div>
                        <div class="info">${s.floor} · ${s.wordbook}</div>
                    </div>
                `).join('');
            }
            
            listEl.style.display = 'block';
        }

        // 학생 선택
        function selectStudent(name) {
            document.getElementById('studentName').value = name;
            document.getElementById('studentList').style.display = 'none';
        }

        // 로그인
        async function login() {
            const name = document.getElementById('studentName').value.trim();
            
            if (!name) {
                showError('이름을 입력해주세요.');
                return;
            }
            
            showLoading(true);
            hideError();
            
            try {
                // 오늘의 시험 정보 가져오기
                const response = await fetch(`${API_URL}?action=getTodayTest&name=${encodeURIComponent(name)}`);
                const data = await response.json();
                
                showLoading(false);
                
                if (!data.success) {
                    showError(data.error || '학생 정보를 찾을 수 없습니다.');
                    return;
                }
                
                todayTestData = data;
                studentData = data.student;
                
                // 재시험 필요 여부 확인
                const retestResponse = await fetch(`${API_URL}?action=checkPendingRetest&name=${encodeURIComponent(name)}`);
                const retestData = await retestResponse.json();
                
                // 모달 표시
                showTodayTestModal(data, retestData);
                
            } catch (error) {
                showLoading(false);
                showError('서버 연결에 실패했습니다. API_URL을 확인해주세요.');
                console.error(error);
            }
        }

        // 오늘의 시험 모달 표시
        function showTodayTestModal(data, retestData) {
            let html = '';
            
            // 인사말
            html += `<h5 class="mb-3">👋 ${data.student.name}님, 안녕하세요!</h5>`;
            
            // 재시험 필요 시
            if (retestData.success && retestData.needsRetest) {
                html += `
                    <div class="retest-warning">
                        <h5><i class="bi bi-exclamation-triangle"></i> 재시험 필요</h5>
                        <p>${retestData.retest.wordbook} ${retestData.retest.lesson}</p>
                        <p>이전 점수: ${retestData.retest.lastScore}점</p>
                        <button class="btn btn-danger" onclick="startTest('retest', ${JSON.stringify(retestData.retest).replace(/"/g, '&quot;')})">
                            <i class="bi bi-arrow-repeat"></i> 재시험 보기
                        </button>
                    </div>
                `;
            }
            
            // 복습 시험
            if (data.reviewTests && data.reviewTests.length > 0) {
                html += `<h6 class="mt-3"><i class="bi bi-arrow-repeat"></i> 복습 시험 (${data.reviewTests.length}개)</h6>`;
                html += `<div class="review-list">`;
                data.reviewTests.forEach((review, idx) => {
                    html += `
                        <div class="review-item">
                            <div><strong>${review.wordbook}</strong> ${review.lesson}</div>
                            <div class="text-muted small">${review.reviewType} 복습</div>
                            <button class="btn btn-warning btn-sm mt-2" onclick="startTest('review', ${JSON.stringify(review).replace(/"/g, '&quot;')})">
                                복습 시험 보기
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            // 정규 시험
            if (data.hasTest) {
                html += `
                    <h6 class="mt-4"><i class="bi bi-journal-check"></i> 정규 시험</h6>
                    <div class="test-info">
                        <div class="test-info-item">
                            <span class="test-info-label">단어장</span>
                            <span class="test-info-value">${data.todayTest.wordbook}</span>
                        </div>
                        <div class="test-info-item">
                            <span class="test-info-label">범위</span>
                            <span class="test-info-value">${data.todayTest.lessons.join(', ')}</span>
                        </div>
                        <div class="test-info-item">
                            <span class="test-info-label">통과 기준</span>
                            <span class="test-info-value">${data.settings['기준점수'] || 80}점</span>
                        </div>
                    </div>
                    <div class="test-info-item">
                        <span class="test-info-label">누적 점수</span>
                        <span class="score-badge ${data.student.score >= 0 ? 'score-positive' : 'score-negative'}">
                            ${data.student.score}점
                        </span>
                    </div>
                    <button class="btn btn-primary w-100 mt-3" onclick="startTest('regular')" ${retestData.needsRetest ? 'disabled' : ''}>
                        <i class="bi bi-play-fill"></i> 정규 시험 시작
                    </button>
                    ${retestData.needsRetest ? '<p class="text-danger text-center mt-2 small">재시험을 먼저 통과해야 합니다.</p>' : ''}
                `;
            } else {
                html += `
                    <div class="alert alert-info mt-3">
                        <i class="bi bi-info-circle"></i> ${data.message || '오늘은 시험일이 아닙니다.'}
                    </div>
                `;
            }
            
            document.getElementById('modalContent').innerHTML = html;
            
            const modal = new bootstrap.Modal(document.getElementById('todayTestModal'));
            modal.show();
        }

        // 시험 시작
        function startTest(type, testInfo = null) {
            const name = studentData.name;
            let params = new URLSearchParams();
            
            params.append('name', name);
            params.append('academyMode', 'true');
            
            if (type === 'regular') {
                params.append('book', todayTestData.todayTest.wordbook);
                params.append('folder', todayTestData.todayTest.folder);
                params.append('lessons', todayTestData.todayTest.lessons.join(','));
                params.append('type', '정규');
                params.append('dailyCount', studentData.dailyCount || 1);
            } else if (type === 'review') {
                // 단어장 매핑 찾기
                params.append('book', testInfo.wordbook);
                params.append('lessons', testInfo.lesson);
                params.append('type', '복습(' + testInfo.reviewType + ')');
                params.append('reviewRowIndex', testInfo.rowIndex);
            } else if (type === 'retest') {
                params.append('book', testInfo.wordbook);
                params.append('lessons', testInfo.lesson);
                params.append('type', '재시험');
                params.append('attempts', (parseInt(testInfo.attempts) || 1) + 1);
            }
            
            params.append('passingScore', todayTestData.settings['기준점수'] || 80);
            
            window.location.href = `test.html?${params.toString()}`;
        }

        // 에러 표시
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // 로딩 표시
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('btnLogin').disabled = show;
        }
    </script>
</body>
</html>
