<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocaBooster - 시험</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 18px;
        }
        
        .header-info {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 4px;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
        }
        
        .progress-fill {
            background: white;
            height: 100%;
            transition: width 0.3s;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 20px 100px;
        }
        
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .question-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .question-word {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .question-hint {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .options {
            display: grid;
            gap: 12px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }
        
        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
            color: #c62828;
        }
        
        .option.correct-answer {
            border-color: #4caf50;
            background: #4caf50;
            color: white;
        }
        
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        
        .bottom-bar-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        /* 결과 피드백 */
        .feedback {
            display: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .feedback.wrong {
            background: #ffebee;
            color: #c62828;
        }
        
        .feedback-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .feedback-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .feedback-answer {
            font-size: 14px;
        }
        
        /* 로딩 화면 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-screen.hide {
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 모드 표시 */
        .mode-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        /* 힌트 버튼 */
        .hint-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .hint-btn:hover {
            background: #f5f5f5;
        }
        
        /* 단어 북마크 */
        .bookmark-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.2s;
        }
        
        .bookmark-btn:hover,
        .bookmark-btn.active {
            opacity: 1;
        }
        
        .question-card {
            position: relative;
        }
        
        /* 타이머 */
        .timer {
            font-size: 14px;
            font-weight: 600;
        }
        
        .timer.warning {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <!-- 로딩 화면 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>단어를 불러오는 중...</p>
    </div>
    
    <!-- 헤더 -->
    <div class="header">
        <div class="header-content">
            <h1 id="headerTitle">📚 시험</h1>
            <div class="header-info">
                <span class="mode-badge" id="modeBadge">정규 시험</span>
                <span id="scoreDisplay">0/0</span>
                <span class="timer" id="timer">--:--</span>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>
    
    <!-- 메인 컨텐츠 -->
    <div class="container">
        <div class="question-card" id="questionCard">
            <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()">☆</button>
            <div class="question-number" id="questionNumber">1 / 40</div>
            <div class="question-word" id="questionWord">Loading...</div>
            <div class="question-hint" id="questionHint"></div>
            <div class="options" id="options">
                <!-- 옵션들이 여기에 렌더링됨 -->
            </div>
            <div class="feedback" id="feedback">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <div class="feedback-text" id="feedbackText"></div>
                <div class="feedback-answer" id="feedbackAnswer"></div>
            </div>
            <center>
                <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 힌트 보기</button>
            </center>
        </div>
    </div>
    
    <!-- 하단 바 -->
    <div class="bottom-bar">
        <div class="bottom-bar-content">
            <button class="btn btn-secondary" onclick="skipQuestion()">건너뛰기</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>다음</button>
        </div>
    </div>
    
    <script>
        // API 설정
        const API_URL = 'https://script.google.com/macros/s/AKfycbwGFbsj8FgFIuF-iFkJ4ekyS76MWQf9UrUysJ-Fs12vuVByJwenoYRgOJeOZiPOa6gzkg/exec';
        const GITHUB_BASE = 'https://raw.githubusercontent.com/tonyhwang1004/vocabooster/main/data';
        
        // 상태 변수
        let currentStudent = null;
        let testData = null;
        let testMode = 'regular';
        let questions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongWords = [];
        let answeredQuestions = [];
        let startTime = null;
        let timerInterval = null;
        let bookmarkedWords = [];
        
        // 페이지 로드
        document.addEventListener('DOMContentLoaded', async function() {
            // 세션에서 정보 가져오기
            const studentStr = sessionStorage.getItem('vb_current_student');
            const testDataStr = sessionStorage.getItem('vb_test_data');
            testMode = new URLSearchParams(window.location.search).get('mode') || 'regular';
            
            if (!studentStr) {
                alert('로그인 정보가 없습니다.');
                window.location.href = 'index.html';
                return;
            }
            
            currentStudent = JSON.parse(studentStr);
            testData = testDataStr ? JSON.parse(testDataStr) : null;
            
            // 모드에 따른 UI 설정
            setupModeUI();
            
            // 단어 로드
            await loadWords();
            
            // 시험 시작
            startTest();
        });
        
        // 모드별 UI 설정
        function setupModeUI() {
            const modeBadge = document.getElementById('modeBadge');
            const headerTitle = document.getElementById('headerTitle');
            
            switch (testMode) {
                case 'regular':
                    modeBadge.textContent = '정규 시험';
                    headerTitle.textContent = '📝 정규 시험';
                    break;
                case 'review':
                    modeBadge.textContent = '복습';
                    modeBadge.style.background = 'rgba(76, 175, 80, 0.3)';
                    headerTitle.textContent = '🔄 복습 시험';
                    break;
                case 'weak':
                    modeBadge.textContent = '취약 단어';
                    modeBadge.style.background = 'rgba(255, 152, 0, 0.3)';
                    headerTitle.textContent = '💪 취약 단어 학습';
                    break;
                case 'practice':
                    modeBadge.textContent = '연습';
                    modeBadge.style.background = 'rgba(33, 150, 243, 0.3)';
                    headerTitle.textContent = '📖 연습 모드';
                    break;
            }
        }
        
        // 단어 로드
        async function loadWords() {
            try {
                if (testMode === 'weak' && testData && testData.weakWords && testData.weakWords.length > 0) {
                    // 취약 단어 모드
                    questions = testData.weakWords.map(w => ({
                        english: w.english,
                        korean: w.korean,
                        wrongCount: w.wrongCount
                    }));
                    shuffleArray(questions);
                } else if (testMode === 'review' && testData && testData.reviewTests && testData.reviewTests.length > 0) {
                    // 복습 모드 - 복습 대기 레슨의 단어 로드
                    const review = testData.reviewTests[0];
                    await loadLessonWords(review.wordbook, review.lesson);
               } else if (testMode === 'practice') {
    // 연습 모드
    if (testData && testData.todayTest) {
        const folder = testData.todayTest.folder;
        const lessons = testData.todayTest.lessons;
        for (const lesson of lessons) {
            await loadLessonWords(testData.todayTest.wordbook, lesson, folder);
        }
    } else {
        // testData 없으면 현재 학생 진도에서 로드
        if (currentStudent && currentStudent.wordbook) {
            const folder = currentStudent.folder || currentStudent.wordbook;
            await loadLessonWords(currentStudent.wordbook, `DAY${currentStudent.currentDay}`, folder);
        }
    }
} else {
    // 정규 모드
    if (testData && testData.todayTest) {
        const folder = testData.todayTest.folder;
        const lessons = testData.todayTest.lessons;
        
        for (const lesson of lessons) {
            await loadLessonWords(testData.todayTest.wordbook, lesson, folder);
        }
    } else if (currentStudent && currentStudent.wordbook) {
        // fallback: 현재 학생 정보로 로드
        const folder = currentStudent.folder || currentStudent.wordbook;
        await loadLessonWords(currentStudent.wordbook, `DAY${currentStudent.currentDay}`, folder);
    }
}
                }
                
                // 문제 수 제한 (최대 40문제)
                if (questions.length > 40) {
                    shuffleArray(questions);
                    questions = questions.slice(0, 40);
                }
                
                // 각 문제에 보기 생성
                generateOptions();
                
            } catch (error) {
                console.error('단어 로드 실패:', error);
                alert('단어를 불러오는데 실패했습니다.');
                window.location.href = 'index.html';
            }
        }
        
        // 레슨 단어 로드
        async function loadLessonWords(wordbook, lesson, folder) {
            try {
                // 폴더 이름 가져오기
                if (!folder && testData && testData.todayTest) {
                    folder = testData.todayTest.folder;
                }
                
                if (!folder) {
                    console.error('폴더 정보 없음');
                    return;
                }
                
                // 레슨 형식에 맞게 파일명 생성
                let fileName = lesson;
                if (!fileName.includes('DAY') && !fileName.includes('day')) {
                    fileName = String(lesson);
                }
                
                const url = `${GITHUB_BASE}/${folder}/${fileName}.json`;
                console.log('Loading:', url);
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.words && Array.isArray(data.words)) {
                    questions.push(...data.words.map(w => ({
                        english: w.english || w.word || w.en,
                        korean: w.korean || w.meaning || w.ko,
                        lesson: lesson
                    })));
                }
            } catch (error) {
                console.error(`레슨 ${lesson} 로드 실패:`, error);
            }
        }
        
        // 보기 생성
        function generateOptions() {
            const allKorean = questions.map(q => q.korean);
            
            questions.forEach(q => {
                // 정답 포함 4개 보기
                const options = [q.korean];
                
                while (options.length < 4) {
                    const randomKorean = allKorean[Math.floor(Math.random() * allKorean.length)];
                    if (!options.includes(randomKorean)) {
                        options.push(randomKorean);
                    }
                }
                
                shuffleArray(options);
                q.options = options;
            });
        }
        
        // 배열 섞기
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // 시험 시작
        function startTest() {
            if (questions.length === 0) {
                alert('시험할 단어가 없습니다.');
                window.location.href = 'index.html';
                return;
            }
            
            document.getElementById('loadingScreen').classList.add('hide');
            startTime = new Date();
            startTimer();
            showQuestion();
        }
        
        // 타이머 시작
        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }
        
        // 문제 표시
        function showQuestion() {
            if (currentIndex >= questions.length) {
                finishTest();
                return;
            }
            
            const q = questions[currentIndex];
            
            document.getElementById('questionNumber').textContent = 
                `${currentIndex + 1} / ${questions.length}`;
            document.getElementById('questionWord').textContent = q.english;
            document.getElementById('progressFill').style.width = 
                `${((currentIndex) / questions.length) * 100}%`;
            document.getElementById('scoreDisplay').textContent = 
                `${correctCount}/${currentIndex}`;
            
            // 힌트 초기화
            document.getElementById('questionHint').textContent = '';
            document.getElementById('hintBtn').style.display = 'inline-block';
            
            // 북마크 상태
            document.getElementById('bookmarkBtn').textContent = 
                bookmarkedWords.includes(q.english) ? '★' : '☆';
            
            // 보기 렌더링
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectOption(btn, opt, q.korean);
                optionsContainer.appendChild(btn);
            });
            
            // 피드백 숨기기
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').disabled = true;
        }
        
        // 옵션 선택
        function selectOption(btn, selected, correct) {
            // 이미 답한 경우 무시
            if (answeredQuestions.includes(currentIndex)) return;
            answeredQuestions.push(currentIndex);
            
            const options = document.querySelectorAll('.option');
            const isCorrect = selected === correct;
            const q = questions[currentIndex];
            
            // 모든 옵션 비활성화
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                if (opt.textContent === correct) {
                    opt.classList.add('correct-answer');
                }
            });
            
            if (isCorrect) {
                btn.classList.add('correct');
                correctCount++;
                showFeedback(true, correct);
            } else {
                btn.classList.add('wrong');
                showFeedback(false, correct);
                
                // 틀린 단어 기록
                wrongWords.push({
                    english: q.english,
                    korean: q.korean,
                    selected: selected,
                    lesson: q.lesson
                });
            }
            
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('hintBtn').style.display = 'none';
        }
        
        // 피드백 표시
        function showFeedback(isCorrect, answer) {
            const feedback = document.getElementById('feedback');
            const icon = document.getElementById('feedbackIcon');
            const text = document.getElementById('feedbackText');
            const answerEl = document.getElementById('feedbackAnswer');
            
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
            icon.textContent = isCorrect ? '🎉' : '😢';
            text.textContent = isCorrect ? '정답입니다!' : '틀렸습니다';
            answerEl.textContent = isCorrect ? '' : `정답: ${answer}`;
        }
        
        // 힌트 표시
        function showHint() {
            const q = questions[currentIndex];
            const hint = q.korean.charAt(0) + '...'; // 첫 글자만 표시
            document.getElementById('questionHint').textContent = `힌트: ${hint}`;
            document.getElementById('hintBtn').style.display = 'none';
        }
        
        // 북마크 토글
        function toggleBookmark() {
            const q = questions[currentIndex];
            const btn = document.getElementById('bookmarkBtn');
            
            if (bookmarkedWords.includes(q.english)) {
                bookmarkedWords = bookmarkedWords.filter(w => w !== q.english);
                btn.textContent = '☆';
            } else {
                bookmarkedWords.push(q.english);
                btn.textContent = '★';
            }
        }
        
        // 다음 문제
        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }
        
        // 건너뛰기
        function skipQuestion() {
            if (!answeredQuestions.includes(currentIndex)) {
                const q = questions[currentIndex];
                wrongWords.push({
                    english: q.english,
                    korean: q.korean,
                    selected: '(건너뜀)',
                    lesson: q.lesson
                });
                answeredQuestions.push(currentIndex);
            }
            currentIndex++;
            showQuestion();
        }
        
        // 시험 종료
        async function finishTest() {
            clearInterval(timerInterval);
            
            const endTime = new Date();
            const duration = Math.floor((endTime - startTime) / 1000);
            const score = Math.round((correctCount / questions.length) * 100);
            
            // 결과 저장
            const resultData = {
                vb: true,
                action: 'saveTestResult',
                name: currentStudent.name,
                wordbook: currentStudent.wordbook,
                lesson: testData?.todayTest?.lessons?.join(', ') || 'N/A',
                type: testMode === 'regular' ? '정규' : testMode === 'review' ? '복습' : testMode === 'weak' ? '취약단어' : '연습',
                score: score,
                duration: duration,
                wrongCount: wrongWords.length,
                wrongWords: wrongWords,
                dailyCount: currentStudent.dailyCount
            };
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(resultData)
                });
                
                const result = await response.json();
                console.log('저장 결과:', result);
            } catch (error) {
                console.error('결과 저장 실패:', error);
            }
            
            // 결과 페이지로 이동
            sessionStorage.setItem('vb_test_result', JSON.stringify({
                score: score,
                total: questions.length,
                correct: correctCount,
                wrong: wrongWords.length,
                duration: duration,
                wrongWords: wrongWords,
                mode: testMode
            }));
            
            window.location.href = 'result.html';
        }
    </script>
</body>
</html>
