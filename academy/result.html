<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VocaBooster - 결과</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .result-card {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .result-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .result-title.pass {
            color: #4caf50;
        }
        
        .result-title.fail {
            color: #f44336;
        }
        
        .result-score {
            font-size: 64px;
            font-weight: 800;
            margin: 20px 0;
        }
        
        .result-score.pass {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-score.fail {
            background: linear-gradient(135deg, #f44336, #ff9800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .wrong-words-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .wrong-word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fff5f5;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #f44336;
        }
        
        .wrong-word-english {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        
        .wrong-word-korean {
            color: #666;
            font-size: 14px;
        }
        
        .wrong-word-selected {
            font-size: 12px;
            color: #f44336;
            margin-top: 4px;
        }
        
        .study-tip {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .study-tip h3 {
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .study-tip p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%);
            color: white;
        }
        
        .progress-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .progress-message.fail {
            background: #fff3e0;
            color: #e65100;
        }
        
        /* 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-card {
            animation: fadeInUp 0.5s ease;
        }
        
        .wrong-words-section {
            animation: fadeInUp 0.5s ease 0.2s;
            animation-fill-mode: both;
        }
        
        .study-tip {
            animation: fadeInUp 0.5s ease 0.3s;
            animation-fill-mode: both;
        }
        
        .btn-group {
            animation: fadeInUp 0.5s ease 0.4s;
            animation-fill-mode: both;
        }
        
        /* 틀린 단어 복습 버튼 */
        .review-wrong-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ff5722;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 15px;
            width: 100%;
        }
        
        .review-wrong-btn:hover {
            background: #e64a19;
        }
        
        /* 학습 팁 리스트 */
        .tip-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .tip-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 13px;
        }
        
        .tip-list li:last-child {
            border-bottom: none;
        }
        
        .tip-list li::before {
            content: '✓ ';
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 결과 카드 -->
        <div class="result-card">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">축하합니다!</div>
            <div class="result-score" id="resultScore">100점</div>
            
            <div class="result-stats">
                <div class="stat-item">
                    <div class="stat-value" id="statCorrect">0</div>
                    <div class="stat-label">정답</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statWrong">0</div>
                    <div class="stat-label">오답</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="statTime">0:00</div>
                    <div class="stat-label">소요시간</div>
                </div>
            </div>
        </div>
        
        <!-- 진도 메시지 -->
        <div class="progress-message" id="progressMessage">
            진도가 업데이트되었습니다!
        </div>
        
        <!-- 틀린 단어 섹션 -->
        <div class="wrong-words-section" id="wrongWordsSection" style="display: none;">
            <div class="section-title">
                <span>❌</span> 틀린 단어 (<span id="wrongCount">0</span>개)
            </div>
            <div id="wrongWordsList"></div>
            <button class="review-wrong-btn" onclick="reviewWrongWords()">
                🔄 틀린 단어 다시 학습하기
            </button>
        </div>
        
        <!-- 학습 팁 -->
        <div class="study-tip" id="studyTip">
            <h3>💡 학습 팁</h3>
            <p id="tipText">틀린 단어는 자동으로 저장되어 복습 시스템에 추가됩니다.</p>
            <ul class="tip-list" id="tipList">
                <li>틀린 단어는 1일, 3일, 7일 후에 다시 출제됩니다</li>
                <li>5번 연속 맞추면 완전 학습으로 처리됩니다</li>
                <li>취약 단어 학습에서 집중 복습하세요</li>
            </ul>
        </div>
        
        <!-- 버튼 그룹 -->
        <div class="btn-group">
            <button class="btn btn-primary" onclick="goHome()">홈으로</button>
            <button class="btn btn-secondary" onclick="goToMyStudy()">📊 내 학습 현황</button>
            <button class="btn btn-warning" id="retestBtn" onclick="retakeTest()" style="display: none;">
                🔄 재시험 보기
            </button>
        </div>
    </div>
    
    <script>
        // 결과 데이터
        let resultData = null;
        let currentStudent = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            // 세션에서 결과 가져오기
            const resultStr = sessionStorage.getItem('vb_test_result');
            const studentStr = sessionStorage.getItem('vb_current_student');
            
            if (!resultStr) {
                window.location.href = 'index.html';
                return;
            }
            
            resultData = JSON.parse(resultStr);
            currentStudent = studentStr ? JSON.parse(studentStr) : null;
            
            displayResult();
        });
        
        function displayResult() {
            const passed = resultData.score >= 80;
            
            // 아이콘 및 타이틀
            document.getElementById('resultIcon').textContent = passed ? '🎉' : '😢';
            document.getElementById('resultTitle').textContent = passed ? '축하합니다!' : '아쉽네요...';
            document.getElementById('resultTitle').className = 'result-title ' + (passed ? 'pass' : 'fail');
            
            // 점수
            document.getElementById('resultScore').textContent = resultData.score + '점';
            document.getElementById('resultScore').className = 'result-score ' + (passed ? 'pass' : 'fail');
            
            // 통계
            document.getElementById('statCorrect').textContent = resultData.correct;
            document.getElementById('statWrong').textContent = resultData.wrong;
            
            const minutes = Math.floor(resultData.duration / 60);
            const seconds = resultData.duration % 60;
            document.getElementById('statTime').textContent = 
                `${minutes}:${String(seconds).padStart(2, '0')}`;
            
            // 진도 메시지
            const progressMsg = document.getElementById('progressMessage');
            if (passed && resultData.mode === 'regular') {
                progressMsg.textContent = '✅ 통과! 진도가 다음 레슨으로 업데이트되었습니다.';
                progressMsg.className = 'progress-message';
            } else if (!passed) {
                progressMsg.textContent = '⚠️ 80점 미만입니다. 재시험을 봐주세요.';
                progressMsg.className = 'progress-message fail';
                document.getElementById('retestBtn').style.display = 'block';
            } else {
                progressMsg.textContent = `${resultData.mode === 'weak' ? '취약 단어' : '복습'} 학습을 완료했습니다!`;
            }
            
            // 틀린 단어 표시
            if (resultData.wrongWords && resultData.wrongWords.length > 0) {
                document.getElementById('wrongWordsSection').style.display = 'block';
                document.getElementById('wrongCount').textContent = resultData.wrongWords.length;
                
                const list = document.getElementById('wrongWordsList');
                resultData.wrongWords.forEach(word => {
                    const item = document.createElement('div');
                    item.className = 'wrong-word-item';
                    item.innerHTML = `
                        <div>
                            <div class="wrong-word-english">${word.english}</div>
                            <div class="wrong-word-korean">${word.korean}</div>
                            <div class="wrong-word-selected">내 답: ${word.selected}</div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }
            
            // 학습 팁 커스터마이징
            if (resultData.wrongWords && resultData.wrongWords.length > 5) {
                document.getElementById('tipText').textContent = 
                    '오답이 많습니다. 틀린 단어를 꼼꼼히 복습해주세요!';
            } else if (passed) {
                document.getElementById('tipText').textContent = 
                    '훌륭합니다! 꾸준히 학습하면 실력이 늘어요.';
            }
        }
        
        function goHome() {
            sessionStorage.removeItem('vb_test_result');
            window.location.href = 'index.html';
        }
        
        function goToMyStudy() {
            window.location.href = 'my-study.html';
        }
        
        function retakeTest() {
            sessionStorage.setItem('vb_test_mode', 'retest');
            window.location.href = 'test.html?mode=regular';
        }
        
        function reviewWrongWords() {
            // 틀린 단어만 세션에 저장하고 테스트 시작
            const testData = {
                weakWords: resultData.wrongWords.map(w => ({
                    english: w.english,
                    korean: w.korean,
                    wrongCount: 1
                }))
            };
            sessionStorage.setItem('vb_test_data', JSON.stringify(testData));
            window.location.href = 'test.html?mode=weak';
        }
    </script>
</body>
</html>
