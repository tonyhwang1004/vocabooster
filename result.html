<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>테스트 결과 - VocaBooster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1a202c;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        .score-circle.excellent {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .score-circle.good {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .score-circle.average {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }
        .score-circle.poor {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .score-label {
            font-size: 14px;
            margin-top: 5px;
        }
        .student-name {
            font-size: 24px;
            font-weight: bold;
            color: #4361ee;
        }
        .test-info {
            color: #718096;
            margin-top: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .stat-item {
            background: #f7fafc;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4361ee;
        }
        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        
        /* 반응 속도 섹션 스타일 */
        .speed-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            color: white;
        }
        .speed-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .speed-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .speed-stat-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .speed-stat-value {
            font-size: 28px;
            font-weight: bold;
        }
        .speed-stat-label {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 3px;
        }
        .speed-breakdown {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .speed-category {
            text-align: center;
        }
        .speed-category-value {
            font-size: 20px;
            font-weight: bold;
        }
        .speed-category-label {
            font-size: 10px;
            opacity: 0.8;
        }
        .speed-category.fast .speed-category-value {
            color: #90EE90;
        }
        .speed-category.medium .speed-category-value {
            color: #FFD700;
        }
        .speed-category.slow .speed-category-value {
            color: #FF6B6B;
        }
        
        /* 즉시 인식률 프로그레스 바 */
        .recognition-bar-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .recognition-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .recognition-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }
        .recognition-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease;
        }
        .recognition-bar-fill.excellent {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }
        .recognition-bar-fill.good {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
        }
        .recognition-bar-fill.average {
            background: linear-gradient(90deg, #f6d365, #fda085);
        }
        .recognition-bar-fill.poor {
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        
        /* 팁 박스 */
        .tip-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 15px;
            font-size: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .tip-box i {
            font-size: 14px;
            margin-top: 2px;
        }
        
        /* 약한 단어 섹션 스타일 */
        .weak-words-section {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px;
            text-align: center;
        }
        .weak-words-title {
            font-size: 16px;
            font-weight: bold;
            color: #721c24;
            margin-bottom: 10px;
        }
        .weak-words-count {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 15px;
        }
        .btn-weak {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-weak:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        .weak-words-tip {
            font-size: 11px;
            color: #718096;
            margin-top: 10px;
        }
        
        .answers-section {
            margin-top: 30px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .answer-item {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }
        .answer-item.correct {
            border-left-color: #38a169;
        }
        .answer-item.wrong {
            border-left-color: #e53e3e;
        }
        .answer-question {
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .answer-detail {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .user-answer {
            color: #4a5568;
        }
        .correct-answer {
            color: #38a169;
            font-weight: bold;
        }
        .wrong-answer {
            color: #e53e3e;
            text-decoration: line-through;
        }
        
        /* 반응 시간 배지 */
        .response-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        .response-badge.fast {
            background: #d4edda;
            color: #155724;
        }
        .response-badge.medium {
            background: #fff3cd;
            color: #856404;
        }
        .response-badge.slow {
            background: #f8d7da;
            color: #721c24;
        }
        .response-badge.none {
            background: #e2e8f0;
            color: #718096;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-action {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-home {
            background: #4361ee;
            color: white;
        }
        .btn-home:hover {
            background: #3845c7;
            color: white;
        }
        .btn-retry {
            background: #48bb78;
            color: white;
        }
        .btn-retry:hover {
            background: #38a169;
            color: white;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .filter-btn.active {
            background: #4361ee;
            color: white;
        }
        .filter-btn:not(.active) {
            background: #e2e8f0;
            color: #4a5568;
        }
        .filter-btn:not(.active):hover {
            background: #cbd5e0;
        }
        .grade-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .grade-A { background: #c6f6d5; color: #276749; }
        .grade-B { background: #bee3f8; color: #2c5282; }
        .grade-C { background: #fefcbf; color: #975a16; }
        .grade-D { background: #fed7d7; color: #9b2c2c; }
        .grade-F { background: #fbd38d; color: #7b341e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-card">
            <div class="score-section">
                <div class="score-circle" id="scoreCircle">
                    <span id="scoreValue">0</span>
                    <span class="score-label">점</span>
                </div>
                <div class="student-name" id="studentName">학생</div>
                <div class="test-info" id="testInfo">테스트 정보</div>
                <div class="grade-badge" id="gradeBadge">등급</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">정답</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">오답</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="timeSpent">0:00</div>
                    <div class="stat-label">소요 시간</div>
                </div>
            </div>
            
            <!-- 스피드 모드 시간 초과 표시 -->
            <div class="stats-grid" id="speedModeStats" style="display: none;">
                <div class="stat-item" style="background: #fff5f5;">
                    <div class="stat-value" style="color: #e53e3e;" id="timeoutCount">0</div>
                    <div class="stat-label">⏰ 시간 초과</div>
                </div>
            </div>

            <!-- 반응 속도 분석 섹션 -->
            <div class="speed-section" id="speedSection">
                <div class="speed-title">
                    <i class="bi bi-lightning-charge-fill"></i> 반응 속도 분석
                </div>
                
                <div class="speed-stats-grid">
                    <div class="speed-stat-item">
                        <div class="speed-stat-value" id="instantRate">0%</div>
                        <div class="speed-stat-label">즉시 인식률 (3초 이내)</div>
                    </div>
                    <div class="speed-stat-item">
                        <div class="speed-stat-value" id="avgResponseTime">0.0초</div>
                        <div class="speed-stat-label">평균 반응 시간</div>
                    </div>
                </div>
                
                <div class="speed-breakdown">
                    <div class="speed-category fast">
                        <div class="speed-category-value" id="fastCount">0</div>
                        <div class="speed-category-label">⚡ 가벼운 단어<br>(3초 이내)</div>
                    </div>
                    <div class="speed-category medium">
                        <div class="speed-category-value" id="mediumCount">0</div>
                        <div class="speed-category-label">⏱️ 연습 필요<br>(3~6초)</div>
                    </div>
                    <div class="speed-category slow">
                        <div class="speed-category-value" id="slowCount">0</div>
                        <div class="speed-category-label">🐢 무거운 단어<br>(6초 초과)</div>
                    </div>
                </div>
                
                <div class="recognition-bar-container">
                    <div class="recognition-bar-label">
                        <span>즉시 인식률</span>
                        <span id="recognitionPercent">0%</span>
                    </div>
                    <div class="recognition-bar">
                        <div class="recognition-bar-fill" id="recognitionBarFill" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="tip-box" id="speedTip">
                    <i class="bi bi-lightbulb-fill"></i>
                    <span id="speedTipText">팁이 여기에 표시됩니다.</span>
                </div>
            </div>

            <div class="action-buttons">
                <a href="index.html" class="btn-action btn-home">
                    <i class="bi bi-house"></i> 홈으로
                </a>
                <button class="btn-action btn-retry" onclick="retryTest()">
                    <i class="bi bi-arrow-repeat"></i> 다시 시험
                </button>
            </div>
            
            <!-- 약한 단어 복습 버튼 -->
            <div class="weak-words-section" id="weakWordsSection" style="display: none;">
                <div class="weak-words-title">
                    <i class="bi bi-exclamation-triangle-fill"></i> 복습이 필요한 단어가 있어요!
                </div>
                <div class="weak-words-count">
                    이 책에서 <strong id="weakWordCount">0</strong>개의 약한 단어가 있습니다.
                </div>
                <button class="btn-action btn-weak" onclick="startWeakWordsReview()">
                    <i class="bi bi-lightning-charge-fill"></i> 약한 단어 집중 복습
                </button>
                <div class="weak-words-tip">
                    * 3회 연속 빠르게 맞추면 약한 단어에서 제외됩니다.
                </div>
            </div>
        </div>

        <div class="result-card answers-section">
            <div class="section-title">
                <i class="bi bi-list-check"></i> 상세 결과
            </div>
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="correct">정답만</button>
                <button class="filter-btn" data-filter="wrong">오답만</button>
                <!-- 반응 속도 필터 추가 -->
                <button class="filter-btn" data-filter="slow-words">🐢 무거운 단어</button>
            </div>

            <div id="answersContainer"></div>
        </div>
    </div>

    <script>
        let resultData = null;

        // 반응 시간 임계값
        const FAST_THRESHOLD = 3;
        const SLOW_THRESHOLD = 6;

        document.addEventListener('DOMContentLoaded', function() {
            // 세션에서 결과 데이터 가져오기
            const savedResult = sessionStorage.getItem('currentResult');
            if (!savedResult) {
                alert('결과 데이터가 없습니다.');
                window.location.href = 'index.html';
                return;
            }

            resultData = JSON.parse(savedResult);
            displayResult(resultData);

            // 필터 버튼 이벤트
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    filterAnswers(this.dataset.filter);
                });
            });
        });

        function displayResult(data) {
            const score = data.score;
            const correct = data.correct;
            const total = data.total;
            const wrong = total - correct;

            // 점수 표시
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('studentName').textContent = data.name;
            document.getElementById('testInfo').textContent = 
                `${data.book} | ${data.mode === 'kor_to_eng' ? '한→영' : '영→한'} | ${total}문제`;

            // 스피드 모드 정보 표시
            if (data.speedModeInfo && data.speedModeInfo.enabled) {
                document.getElementById('testInfo').textContent += ` | ⚡ 스피드 ${data.speedModeInfo.limit}초`;
            }

            // 점수 원 색상
            const scoreCircle = document.getElementById('scoreCircle');
            if (score >= 90) scoreCircle.classList.add('excellent');
            else if (score >= 70) scoreCircle.classList.add('good');
            else if (score >= 50) scoreCircle.classList.add('average');
            else scoreCircle.classList.add('poor');

            // 등급
            const gradeBadge = document.getElementById('gradeBadge');
            let grade, gradeClass;
            if (score >= 90) { grade = 'A'; gradeClass = 'grade-A'; }
            else if (score >= 80) { grade = 'B'; gradeClass = 'grade-B'; }
            else if (score >= 70) { grade = 'C'; gradeClass = 'grade-C'; }
            else if (score >= 60) { grade = 'D'; gradeClass = 'grade-D'; }
            else { grade = 'F'; gradeClass = 'grade-F'; }
            gradeBadge.textContent = `${grade} 등급`;
            gradeBadge.classList.add(gradeClass);

            // 통계
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            
            const minutes = Math.floor(data.time / 60);
            const seconds = data.time % 60;
            document.getElementById('timeSpent').textContent = 
                `${minutes}:${String(seconds).padStart(2, '0')}`;

            // 반응 속도 통계 표시
            displaySpeedStats(data);
            
            // 스피드 모드 시간 초과 표시
            if (data.speedModeInfo && data.speedModeInfo.enabled) {
                document.getElementById('speedModeStats').style.display = 'grid';
                document.getElementById('timeoutCount').textContent = data.speedModeInfo.timeoutCount || 0;
            }

            // 상세 결과
            renderAnswers(data.details);
            
            // 약한 단어 섹션 표시
            displayWeakWords(data);
        }

        // 반응 속도 통계 표시
        function displaySpeedStats(data) {
            const speedSection = document.getElementById('speedSection');
            
            // speedStats가 없으면 (기존 데이터) 섹션 숨기기
            if (!data.speedStats) {
                speedSection.style.display = 'none';
                return;
            }
            
            const stats = data.speedStats;
            
            // 즉시 인식률
            document.getElementById('instantRate').textContent = stats.instantRecognitionRate + '%';
            document.getElementById('recognitionPercent').textContent = stats.instantRecognitionRate + '%';
            
            // 평균 반응 시간
            document.getElementById('avgResponseTime').textContent = stats.avgResponseTime.toFixed(1) + '초';
            
            // 카테고리별 개수
            document.getElementById('fastCount').textContent = stats.fastCount;
            document.getElementById('mediumCount').textContent = stats.slowCount;
            document.getElementById('slowCount').textContent = stats.verySlowCount;
            
            // 프로그레스 바
            const barFill = document.getElementById('recognitionBarFill');
            const rate = stats.instantRecognitionRate;
            
            // 애니메이션을 위해 setTimeout 사용
            setTimeout(() => {
                barFill.style.width = rate + '%';
            }, 100);
            
            // 바 색상
            if (rate >= 80) barFill.classList.add('excellent');
            else if (rate >= 60) barFill.classList.add('good');
            else if (rate >= 40) barFill.classList.add('average');
            else barFill.classList.add('poor');
            
            // 맞춤형 팁 표시
            displaySpeedTip(stats, data.correct);
        }

        // 맞춤형 팁 생성
        function displaySpeedTip(stats, correctCount) {
            const tipText = document.getElementById('speedTipText');
            
            if (correctCount === 0) {
                tipText.textContent = "다음에는 더 좋은 결과가 있을 거예요! 꾸준히 연습해보세요.";
                return;
            }
            
            const rate = stats.instantRecognitionRate;
            const avgTime = stats.avgResponseTime;
            const slowWords = stats.verySlowCount;
            
            if (rate >= 80 && avgTime <= 3) {
                tipText.textContent = "🎉 훌륭해요! 단어들이 거의 자동으로 떠오르고 있어요. 독해 시 흐름이 끊기지 않을 거예요!";
            } else if (rate >= 60) {
                tipText.textContent = "👍 좋은 진전이에요! 즉시 인식률이 60% 이상이에요. 조금 더 연습하면 단어가 더 '가벼워'질 거예요.";
            } else if (slowWords > 5) {
                tipText.textContent = `⚠️ '무거운 단어'가 ${slowWords}개 있어요. 이 단어들을 집중적으로 복습하면 독해 속도가 빨라질 거예요.`;
            } else if (avgTime > 5) {
                tipText.textContent = "💡 평균 반응 시간이 5초를 넘어요. 단어를 더 자주 마주치면 자연스럽게 빨라질 거예요!";
            } else {
                tipText.textContent = "📚 꾸준히 연습하면 단어가 점점 '가벼워'져요. 반복 노출이 핵심이에요!";
            }
        }

        // 약한 단어 섹션 표시
        function displayWeakWords(data) {
            const weakWords = JSON.parse(localStorage.getItem('vocabooster_weak_words') || '{}');
            
            let currentBookWeakCount = 0;
            
            for (const bookKey in weakWords) {
                const bookWeakWords = weakWords[bookKey];
                
                for (const wordKey in bookWeakWords) {
                    if (bookWeakWords[wordKey].isWeak) {
                        currentBookWeakCount++;
                    }
                }
            }
            
            if (currentBookWeakCount > 0) {
                document.getElementById('weakWordsSection').style.display = 'block';
                document.getElementById('weakWordCount').textContent = currentBookWeakCount;
            }
        }

        // 약한 단어 복습 시작
        function startWeakWordsReview() {
            const weakWords = JSON.parse(localStorage.getItem('vocabooster_weak_words') || '{}');
            
            // 약한 단어 수집
            let weakWordsList = [];
            let bookFolder = null;
            
            for (const bookKey in weakWords) {
                for (const wordKey in weakWords[bookKey]) {
                    const wordData = weakWords[bookKey][wordKey];
                    if (wordData.isWeak && wordData.originalWord) {
                        weakWordsList.push(wordData.originalWord);
                        if (!bookFolder) bookFolder = bookKey;
                    }
                }
            }
            
            if (weakWordsList.length === 0) {
                alert('복습할 약한 단어가 없습니다!');
                return;
            }
            
            // 약한 단어를 세션 스토리지에 저장
            sessionStorage.setItem('weakWordsReview', JSON.stringify({
                words: weakWordsList,
                bookFolder: bookFolder
            }));
            
            // 복습 모드로 test.html 이동
            const params = new URLSearchParams({
                name: resultData.name,
                book: resultData.book,
                mode: resultData.mode,
                reviewMode: 'weak' // 약한 단어 복습 모드
            });
            window.location.href = `test.html?${params.toString()}`;
        }

        function renderAnswers(details) {
            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            details.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = `answer-item ${item.isCorrect ? 'correct' : 'wrong'}`;
                div.dataset.type = item.isCorrect ? 'correct' : 'wrong';
                
                // 반응 시간에 따른 분류
                const responseTime = item.responseTime;
                let speedClass = 'none';
                let speedText = '-';
                
                if (responseTime !== null && responseTime !== undefined) {
                    if (responseTime <= FAST_THRESHOLD) {
                        speedClass = 'fast';
                        speedText = `⚡ ${responseTime.toFixed(1)}초`;
                    } else if (responseTime <= SLOW_THRESHOLD) {
                        speedClass = 'medium';
                        speedText = `⏱️ ${responseTime.toFixed(1)}초`;
                    } else {
                        speedClass = 'slow';
                        speedText = `🐢 ${responseTime.toFixed(1)}초`;
                    }
                }
                
                div.dataset.speed = speedClass;

                div.innerHTML = `
                    <div class="answer-question">
                        <span>
                            <span style="color: #718096; margin-right: 10px;">${i + 1}.</span>
                            ${item.question}
                        </span>
                        <span class="response-badge ${speedClass}">${speedText}</span>
                    </div>
                    <div class="answer-detail">
                        <span class="user-answer">
                            내 답: <span class="${item.isCorrect ? '' : 'wrong-answer'}">${item.userAnswer || '(미입력)'}</span>
                        </span>
                        <span class="correct-answer">정답: ${item.correctAnswer}</span>
                    </div>
                `;

                container.appendChild(div);
            });
        }

        function filterAnswers(filter) {
            const items = document.querySelectorAll('.answer-item');
            items.forEach(item => {
                if (filter === 'all') {
                    item.style.display = 'block';
                } else if (filter === 'correct') {
                    item.style.display = item.dataset.type === 'correct' ? 'block' : 'none';
                } else if (filter === 'wrong') {
                    item.style.display = item.dataset.type === 'wrong' ? 'block' : 'none';
                } else if (filter === 'slow-words') {
                    // 무거운 단어 필터 (6초 초과)
                    item.style.display = item.dataset.speed === 'slow' ? 'block' : 'none';
                }
            });
        }

        function retryTest() {
            if (resultData) {
                const params = new URLSearchParams({
                    name: resultData.name,
                    book: resultData.book,
                    folder: resultData.folder || resultData.book,  // 🆕 폴더 정보 추가
                    lessons: resultData.lessons.replace(/, /g, ','),
                    count: resultData.total,
                    mode: resultData.mode
                });
                window.location.href = `test.html?${params.toString()}`;
            }
        }
    </script>
</body>
